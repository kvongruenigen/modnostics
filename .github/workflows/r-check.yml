name: R Check

on:
  push:
    branches:
      - master
      - dev
      - codex-audit-backlog
  pull_request:

jobs:
  r-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat

      - name: Run tests
        run: Rscript -e 'testthat::test_local(".")'

      - name: Build package
        run: R CMD build .

      - name: Check package
        run: R CMD check --no-manual modnostics_*.tar.gz
